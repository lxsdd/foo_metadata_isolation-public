name: Recheck original foobar2000 Masstagger 1.9.3 availability safely

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/masstagger-2026-original-preflight.yml'
      - 'tests/masstagger_2026_original_preflight.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-masstagger-source:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect original Masstagger 1.9.3 binary package in memory and report SHA256
        shell: pwsh
        run: |
          ./tests/masstagger_2026_original_preflight.ps1
      # No executable launch, third-party mirrors, user accounts, uploaded
      # artifacts, caches or component DLL distribution.
