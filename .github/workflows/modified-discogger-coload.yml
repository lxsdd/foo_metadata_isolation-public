name: Modified Discogger + Metadata Isolation + Studio original foobar co-load (test-only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/modified-discogger-coload.yml'
      - 'tests/**'
      - 'src/**'
      - 'scripts/verify-public-artifact-hold.py'
      - 'ci/test-latest-sdk.ps1'
      - 'sdk/SDK-PIN.json'
      - 'validate_project.ps1'
      - 'component.sln'
      - 'component.props'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mi-modified-discogger-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-coload:
    runs-on: windows-2022
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        architecture: [Win32, x64]
    steps:
      - name: Exact Metadata Isolation draft checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned modified Discogger draft checkout
        uses: actions/checkout@v4
        with:
          repository: lxsdd/foo_discogger
          ref: 366cf4f71f72fed1e57f868175f3aa82591ffbec
          path: external/discogger-draft
          persist-credentials: false
      - name: Pinned current Music Metadata Studio draft checkout
        uses: actions/checkout@v4
        with:
          repository: lxsdd/music-metadata-studio
          ref: 73ff5420f75add5ac15fcbcf3fb4cd6be7a01647
          path: external/studio-draft
          persist-credentials: false
      - name: Exact reviewed SDK template for Metadata Isolation
        uses: actions/checkout@v4
        with:
          repository: lxsdd/foobar2000_component_template
          ref: 31a35947a7527826c2199491692802e3ce3d8bd7
          path: external/sdk-template
          persist-credentials: false
      - name: Exact reviewed SDK template for Discogger
        uses: actions/checkout@v4
        with:
          repository: lxsdd/foobar2000_component_template
          ref: 31a35947a7527826c2199491692802e3ce3d8bd7
          path: external/discogger-draft/external/sdk-template
          persist-credentials: false
      - name: Exact reviewed SDK template for Studio
        uses: actions/checkout@v4
        with:
          repository: lxsdd/foobar2000_component_template
          ref: 31a35947a7527826c2199491692802e3ce3d8bd7
          path: external/studio-draft/external/sdk-template
          persist-credentials: false
      - name: Immutable pinned original foobar installer transport
        uses: actions/checkout@v4
        with:
          repository: lxsdd/dev-infrastructure-public
          ref: 35369054c56f4c6ccb2f802944e9675852fd35ec
          path: .ci_installer
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Verify external draft identity and no-public-binary gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $expected='366cf4f71f72fed1e57f868175f3aa82591ffbec'
          if((& git -C external/discogger-draft rev-parse HEAD).Trim() -cne $expected){throw 'Modified Discogger source SHA mismatch'}
          $studioExpected='73ff5420f75add5ac15fcbcf3fb4cd6be7a01647'
          if((& git -C external/studio-draft rev-parse HEAD).Trim() -cne $studioExpected){throw 'Studio source SHA mismatch'}
          & python scripts/verify-public-artifact-hold.py
          if($LASTEXITCODE -ne 0){throw 'Source-only artifact hold failed'}
          & python tests/verify_source_release_provenance.py
          if($LASTEXITCODE -ne 0){throw 'Source provenance failed'}
          Write-Host 'MODIFIED_DISCOGGER_SOURCE_SHA=PASS_EXACT_PIN'
          Write-Host 'MMS_SOURCE_SHA=PASS_EXACT_PIN'
      - name: Stage all verified Discogger dependencies and build actual DLL
        shell: pwsh
        working-directory: external/discogger-draft
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/probe-official-sdk.ps1
          ./scripts/build-official-sdk-libs.ps1
          ./scripts/diagnose-component-compile.ps1 -StageOnly
          $env:CL='/DDISCOGGER_RUNNER_MEDIA_QA '+$env:CL
          ./scripts/build-component-dll.ps1 -Platforms '${{ matrix.architecture }}'
          $dll=Join-Path $env:RUNNER_TEMP 'discogger-sdk-probe/foobar2000/foo_discogger/${{ matrix.architecture }}/Release/foo_discogger.dll'
          if(-not (Test-Path -LiteralPath $dll -PathType Leaf)){throw 'Runner-only modified Discogger DLL missing'}
          Write-Host 'MODIFIED_DISCOGGER_ACTUAL_DLL_${{ matrix.architecture }}=PASS'
      - name: Build pinned Studio default read-only component DLL
        shell: pwsh
        working-directory: external/studio-draft
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build-foobar.ps1 -Platform '${{ matrix.architecture }}' -Configuration Release -PlatformToolset v143
          if($LASTEXITCODE -ne 0){throw 'Studio build failed'}
          $dll=Join-Path (Get-Location) 'out/foobar/${{ matrix.architecture }}/Release/foo_music_metadata_studio.dll'
          if(-not (Test-Path -LiteralPath $dll -PathType Leaf)){throw 'Pinned default Studio DLL missing'}
          Write-Host 'MMS_ACTUAL_DEFAULT_READONLY_DLL_${{ matrix.architecture }}=PASS'
      - name: Build the exact Metadata Isolation HEAD with verified SDK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./ci/test-latest-sdk.ps1
          ./validate_project.ps1
          $wtl=Join-Path (Get-Location) 'wtl/Include'
          if(-not (Test-Path -LiteralPath (Join-Path $wtl 'atlapp.h'))){throw 'WTL header absent'}
          $env:CL='/I"' + $wtl + '" ' + $env:CL
          & msbuild component.sln /t:Build /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:EnableTestProbes=true /p:PlatformToolset=v143 /p:LanguageStandard=stdcpp23 /m:2 /verbosity:minimal
          if($LASTEXITCODE -ne 0){throw 'Metadata Isolation build failed'}
      - name: Real original Win32/x64 three-component co-load and synthetic physical safety
        shell: pwsh
        env:
          DISCOGGER_MODIFIED_SOURCE_SHA: 366cf4f71f72fed1e57f868175f3aa82591ffbec
          MMS_PINNED_SOURCE_SHA: 73ff5420f75add5ac15fcbcf3fb4cd6be7a01647
        run: |
          $ErrorActionPreference='Stop'
          $arch='${{ matrix.architecture }}'
          $metadata=if($arch -eq 'Win32'){'build/foo_metadata_isolation.dll'}else{'build/x64/foo_metadata_isolation.dll'}
          $discDll=Join-Path $env:RUNNER_TEMP "discogger-sdk-probe/foobar2000/foo_discogger/$arch/Release/foo_discogger.dll"
          $studioDll=Join-Path (Get-Location) "external/studio-draft/out/foobar/$arch/Release/foo_music_metadata_studio.dll"
          ./tests/run_isolated_virtual_write.ps1 -Architecture $arch -ComponentDll $metadata -CompanionDiscoggerDll $discDll -CompanionDiscoggerConfigDb 'external/discogger-draft/foo_discogger.dll.db' -CompanionStudioDll $studioDll -RunPhysicalMetadata -RunDirectGuard
          if($LASTEXITCODE -ne 0){throw 'Original foobar three-component host qualification failed'}
          Write-Host "MODIFIED_DISCOGGER_PHYSICAL_ISOLATION_COLOAD_$arch=PASS"
          Write-Host "PINNED_STUDIO_DISCOGGER_ISOLATION_PHYSICAL_GUARDS_$arch=PASS"
      # Absolutely no upload-artifact, caches, OAuth secrets or user files.
