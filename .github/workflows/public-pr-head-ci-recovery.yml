name: Public metadata-isolation CI recovery

# CI-only fallback for selected same-repository PRs. Never a release candidate.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  missing-public-ci:
    uses: lxsdd/dev-infrastructure-public/.github/workflows/dispatch-pr-head-ci.yml@eed379ee8ed8a478285b437176ab61e12cfff0ce
    with:
      pr_numbers: '6,7'
      workflow_files: 'migration.yml'
      base_branch: main
