name: Isolated virtual writer E2E (test-only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/isolated-virtual-write.yml'
      - 'tests/make_isolated_embedded_mp3.py'
      - 'tests/assert_isolated_virtual_write.py'
      - 'tests/run_isolated_virtual_write.ps1'
      - 'tests/make_large_embedded_mp3.py'
      - 'tests/assert_large_virtual_benchmark.py'
      - 'tests/assert_isolated_write_guard.py'
      - 'tests/assert_isolated_physical_write.py'
      - 'tests/assert_isolated_replaygain_write.py'
      - 'tests/make_isolated_timing_mp3.py'
      - 'tests/assert_isolated_timing_write.py'
      - 'tests/assert_isolated_ux_contracts.py'
      - 'tests/assert_real_audit_uia.ps1'
      - 'tests/assert_real_virtual_timing_uia.ps1'
      - 'tests/assert_real_virtual_timing_ui_commit.py'
      - 'src/**'
      - 'component.sln'

concurrency:
  group: metadata-isolation-writer-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolated-virtual-write:
    runs-on: windows-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Win32
            dll: build/foo_metadata_isolation.dll
          - architecture: x64
            dll: build/x64/foo_metadata_isolation.dll
    steps:
      - uses: actions/checkout@v7
      - name: Checkout reviewed shared UIA adapter (source only)
        uses: actions/checkout@v7
        with:
          repository: lxsdd/dev-infrastructure-public
          ref: 3482a2beb4d91c9875bc28b91bd43287bab47bc6
          path: .ci_shared
          persist-credentials: false
      - name: Checkout verified, immutable installer transport helper (source only)
        uses: actions/checkout@v7
        with:
          repository: lxsdd/dev-infrastructure-public
          ref: 35369054c56f4c6ccb2f802944e9675852fd35ec
          path: .ci_installer
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v2
      - name: Build disposable probe-enabled DLL (never upload)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./validate_project.ps1
          & msbuild component.sln /t:Build /p:Configuration=Release /p:Platform=${{ matrix.architecture }} /p:EnableTestProbes=true /p:PlatformToolset=v145 /p:LanguageStandard=stdcpp23 /m:2 /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Probe-enabled DLL build failed' }
      - name: Test real foobar isolated embedded-Cue virtual TITLE write
        shell: pwsh
        run: ./tests/run_isolated_virtual_write.ps1 -Architecture '${{ matrix.architecture }}' -ComponentDll '${{ matrix.dll }}' -RunLargeBenchmark -RunPhysicalMetadata -RunVirtualReplayGain -RunCueTiming -RunDirectGuard -RunUiContracts -RunRealAuditUia -RunRealTimingUia
      # Probe-enabled DLLs and synthetic media must never leave runner temp.
      # No artifact, cache or public distribution of test-only binaries.
